<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Wordle - Jeu de mots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Wordle</h1>
    <!-- Game mode selection -->
    <div id="mode-selection">
        <label for="modeSelect">Mode de jeu :</label>
        <select id="modeSelect">
            <option value="Classic">Classique</option>
            <option value="Timed">Chronométré</option>
            <option value="Practice">Entraînement</option>
        </select>
    </div>
    <!-- Timer display (visible only for Timed mode) -->
    <div id="timer" style="font-size:1.2rem; margin:10px 0;"></div>

    <div id="error-message"></div>

    <div id="game">
        <div id="board"></div>
        <div id="virtual-keyboard"></div>
        <!-- (No physical input field now, since we use global keydown and virtual keyboard) -->
        <button id="restartBtn" type="button">Nouvelle Partie</button>
    </div>
    <div id="message"></div>
    <div id="stats"></div>
    <!-- For testing only: display solution (to be removed in production) -->
</div>
<script type="module" src="/src/ui.ts"></script>
</body>
</html>
